name: CMake Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # Use matrix strategy to run on both Ubuntu and macOS
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      # Install libraries required by CMakeLists.txt on Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libboost-all-dev \
          libfmt-dev \
          libmsgpack-dev \
          libopencv-dev \
          nlohmann-json3-dev \
          zlib1g-dev \
          liblz4-dev \
          libdlib-dev \
          libx11-dev \
          libblas-dev \
          liblapack-dev \
          libopenblas-dev

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      # Install libraries required by CMakeLists.txt on macOS via Homebrew
      run: |
        brew update
        brew install cmake boost fmt msgpack-cxx opencv nlohmann-json zlib lz4 dlib openblas

    - name: Patch Source Code for CI
      run: |
        # --- Fix 1: Boost.Asio io_context compatibility (macOS/Boost 1.90+) ---
        
        # A. Replace deprecated '.post()' calls with 'boost::asio::post(executor, ...)'
        # We target specific variables to ensure correctness
        
        # asio_msgpack.hpp: s.get_io_service().post(...) -> boost::asio::post(s.get_executor(), ...)
        sed -i.bak 's/s.get_io_service().post(/boost::asio::post(s.get_executor(), /g' include/api/asio_msgpack.hpp
        
        # session.hpp: m_socket.get_io_service().post(...) -> boost::asio::post(m_socket.get_executor(), ...)
        sed -i.bak 's/m_socket.get_io_service().post(/boost::asio::post(m_socket.get_executor(), /g' src/server/session.hpp
        
        # server.hpp: m_acceptor.get_io_service().post(...) -> boost::asio::post(m_acceptor.get_executor(), ...)
        sed -i.bak 's/m_acceptor.get_io_service().post(/boost::asio::post(m_acceptor.get_executor(), /g' src/server/server.hpp
        
        # queued_writer.hpp: m_writer.get_io_service().post(...) -> boost::asio::post(m_writer.get_executor(), ...)
        sed -i.bak 's/m_writer.get_io_service().post(/boost::asio::post(m_writer.get_executor(), /g' include/api/queued_writer.hpp

        # B. Fix get_io_service() implementation in headers
        # Note: Return types are handled by -Dio_service=io_context in CMakeLists.txt
        
        # basic_msgpack_writer.hpp
        sed -i.bak 's/m_ws.get_io_service()/((boost::asio::io_context\&)m_ws.get_executor().context())/g' include/api/basic_msgpack_writer.hpp
        
        # basic_msgpack_reader.hpp
        sed -i.bak 's/m_rs.get_io_service()/((boost::asio::io_context\&)m_rs.get_executor().context())/g' include/api/basic_msgpack_reader.hpp

        # --- Fix 2: OpenCV 4.x compatibility ---
        sed -i.bak 's/CV_BGR2HSV/cv::COLOR_BGR2HSV/g' src/api/Detect.cpp
        sed -i.bak 's/CV_HSV2BGR/cv::COLOR_HSV2BGR/g' src/api/Detect.cpp

        # Cleanup
        find . -name "*.bak" -type f -delete

    - name: Patch dlib System Header (Linux only)
      if: runner.os == 'Linux'
      # Fix dlib GUI error on Linux (DLIB_NO_GUI_SUPPORT defined by default in package)
      run: |
        sudo sed -i '1i #undef DLIB_NO_GUI_SUPPORT' /usr/include/dlib/gui_core/gui_core_kernel_2.h

    - name: Configure CMake
      # -DBoost_NO_BOOST_CMAKE=ON: Fixes error on macOS where Boost 1.90+ Config files are missing component configs.
      # -Wno-dev: Suppresses non-critical developer warnings (like the version policy warning).
      # -DCMAKE_POLICY_VERSION_MINIMUM=3.5: Ensures compatibility for the version check.
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBoost_NO_BOOST_CMAKE=ON -Wno-dev

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
name: CMake Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install System Dependencies
      # Install libraries required by CMakeLists.txt
      # mapping:
      #   Boost   -> libboost-all-dev (includes system, filesystem, etc.)
      #   fmt     -> libfmt-dev
      #   Msgpack -> libmsgpack-dev
      #   OpenCV  -> libopencv-dev
      #   Json    -> nlohmann-json3-dev (Assumes nlohmann-json is the target)
      #   ZLIB    -> zlib1g-dev
      #   LZ4     -> liblz4-dev
      #   dlib    -> libdlib-dev
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libboost-all-dev \
          libfmt-dev \
          libmsgpack-dev \
          libopencv-dev \
          nlohmann-json3-dev \
          zlib1g-dev \
          liblz4-dev \
          libdlib-dev \
          libx11-dev

    - name: Patch Source Code for CI
      # Fix 1: 'get_io_service' error due to newer Boost version in CI environment
      # Fix 2: OpenCV 4.x compatibility (CV_BGR2HSV -> cv::COLOR_BGR2HSV)
      # Fix 3: dlib GUI error (DLIB_NO_GUI_SUPPORT defined by default in package)
      run: |
        # Fix Boost.Asio: Only replace the usage inside the function, not the function definition
        sed -i 's/m_ws.get_io_service()/((boost::asio::io_context\&)m_ws.get_executor().context())/g' include/api/basic_msgpack_writer.hpp
        
        # Fix OpenCV constants in src/api/Detect.cpp
        sed -i 's/CV_BGR2HSV/cv::COLOR_BGR2HSV/g' src/api/Detect.cpp
        sed -i 's/CV_HSV2BGR/cv::COLOR_HSV2BGR/g' src/api/Detect.cpp

        # Fix dlib GUI compilation: force undefine DLIB_NO_GUI_SUPPORT in the system header
        # This bypasses the #error check since we already installed libx11-dev
        sudo sed -i '1i #undef DLIB_NO_GUI_SUPPORT' /usr/include/dlib/gui_core/gui_core_kernel_2.h

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required for single-configuration generators such as "Unix Makefiles".
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    # - name: Test
    #   working-directory: ${{github.workspace}}/build
    #   run: ctest -C ${{env.BUILD_TYPE}}
name: CMake Build Matrix

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows, Mac or Linux.
    # See https://github.com/marketplace/actions/configure-cmake-build-machine-code-quality-and-more-for-cmake-projects
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      # Install libraries required by CMakeLists.txt on Ubuntu
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libboost-all-dev \
          libfmt-dev \
          libmsgpack-dev \
          libopencv-dev \
          nlohmann-json3-dev \
          zlib1g-dev \
          liblz4-dev \
          libdlib-dev \
          libx11-dev \
          libblas-dev \
          liblapack-dev \
          libopenblas-dev

    - name: Install System Dependencies (macOS)
      if: runner.os == 'macOS'
      # Install libraries required by CMakeLists.txt on macOS via Homebrew
      run: |
        brew update
        brew install cmake boost fmt msgpack-cxx opencv nlohmann-json zlib lz4 dlib openblas libx11

    - name: Patch Source Code for CI
      if: runner.os == 'macOS' || runner.os == 'Linux'
      # Fix 1: 'get_io_service' error due to newer Boost version
      # Fix 2: OpenCV 4.x compatibility
      # Fix 3: Boost Resolver Iterator deprecation (hint-client)
      # Fix 4: Boost Resolver Iterator deprecation (image-client)
      # Note: We use 'sed -i.bak' to ensure compatibility between GNU sed (Linux) and BSD sed (macOS)
      run: |
        # --- Fix 1: Boost.Asio io_context compatibility ---
        
        # A. Replace deprecated '.post()' calls with 'boost::asio::post(executor, ...)'
        # We target specific variables to ensure correctness
        
        # asio_msgpack.hpp: s.get_io_service().post(...) -> boost::asio::post(s.get_executor(), ...)
        # Assumes 's' is a stream/socket with get_executor()
        sed -i.bak 's/s.get_io_service().post(/boost::asio::post(s.get_executor(), /g' include/api/asio_msgpack.hpp
        
        # session.hpp: m_socket.get_io_service().post(...) -> boost::asio::post(m_socket.get_executor(), ...)
        sed -i.bak 's/m_socket.get_io_service().post(/boost::asio::post(m_socket.get_executor(), /g' src/server/session.hpp
        
        # server.hpp: m_acceptor.get_io_service().post(...) -> boost::asio::post(m_acceptor.get_executor(), ...)
        sed -i.bak 's/m_acceptor.get_io_service().post(/boost::asio::post(m_acceptor.get_executor(), /g' src/server/server.hpp
        
        # queued_writer.hpp: m_writer.get_io_service().post(...) -> boost::asio::post(m_writer.get_io_service().get_executor(), ...)
        # Note: m_writer is a wrapper (basic_msgpack_writer) and usually does NOT have get_executor().
        # We must call get_io_service() first (which returns context), then get_executor() from that context.
        sed -i.bak 's/m_writer.get_io_service().post(/boost::asio::post(m_writer.get_io_service().get_executor(), /g' include/api/queued_writer.hpp

        # B. Fix get_io_service() implementation in headers
        # Note: Return types are handled by -Dio_service=io_context in CMakeLists.txt on macOS.
        # This patch fixes the implementation to use get_executor().context() because socket.get_io_service() is gone.
        
        # basic_msgpack_writer.hpp
        sed -i.bak 's/m_ws.get_io_service()/((boost::asio::io_context\&)m_ws.get_executor().context())/g' include/api/basic_msgpack_writer.hpp
        
        # basic_msgpack_reader.hpp
        sed -i.bak 's/m_rs.get_io_service()/((boost::asio::io_context\&)m_rs.get_executor().context())/g' include/api/basic_msgpack_reader.hpp

        # --- Fix 2: OpenCV 4.x compatibility ---
        sed -i.bak 's/CV_BGR2HSV/cv::COLOR_BGR2HSV/g' src/api/Detect.cpp
        sed -i.bak 's/CV_HSV2BGR/cv::COLOR_HSV2BGR/g' src/api/Detect.cpp

        # --- Fix 3: Boost Resolver Iterator deprecation (hint-client) ---
        # 1. Replace deprecated tcp::resolver::iterator with boost::asio::ip::tcp::resolver::results_type (Global replace)
        sed -i.bak 's/tcp::resolver::iterator/boost::asio::ip::tcp::resolver::results_type/g' src/hint-client/client.hpp
        sed -i.bak 's/tcp::resolver::iterator/boost::asio::ip::tcp::resolver::results_type/g' src/hint-client/main.cpp
        
        # 2. Fix the Lambda parameter inside async_connect.
        # The previous step incorrectly changed the lambda arg to 'results_type', but async_connect passes an 'endpoint'.
        # We match the pattern "ec, <results_type>" and change it to "ec, <endpoint>"
        # Also matching the short form "tcp::resolver::results_type" in case of manual edits or partial matches.
        sed -i.bak 's/ec, boost::asio::ip::tcp::resolver::results_type/ec, boost::asio::ip::tcp::endpoint/g' src/hint-client/client.hpp
        sed -i.bak 's/ec, tcp::resolver::results_type/ec, boost::asio::ip::tcp::endpoint/g' src/hint-client/client.hpp
        
        # 3. Fix resolve call (resolver.resolve(query) is removed). 
        # Replace with resolver.resolve(argv[1], argv[2]) assuming standard client args.
        # Also handles the initializer list case: resolve({argv[1], argv[2]}) -> resolve(argv[1], argv[2])
        sed -i.bak 's/resolver.resolve(query)/resolver.resolve(argv[1], argv[2])/g' src/hint-client/main.cpp
        sed -i.bak 's/resolver.resolve({ argv\[1\], argv\[2\] })/resolver.resolve(argv[1], argv[2])/g' src/hint-client/main.cpp

        # 4. Fix other deprecated Boost.Asio members in hint-client
        # UPDATED: Use .get_executor() to support both Boost 1.74 (Ubuntu) and 1.90 (macOS)
        # m_ios.post(...) -> boost::asio::post(m_ios.get_executor(), ...)
        sed -i.bak 's/m_ios.post(/boost::asio::post(m_ios.get_executor(), /g' src/hint-client/client.hpp
        # m_timer.expires_from_now(...) -> m_timer.expires_after(...)
        sed -i.bak 's/expires_from_now/expires_after/g' src/hint-client/client.hpp


        # --- Fix 4: Boost Resolver Iterator deprecation (image-client) ---
        # 1. Replace deprecated tcp::resolver::iterator with tcp::resolver::results_type
        sed -i.bak 's/tcp::resolver::iterator/boost::asio::ip::tcp::resolver::results_type/g' src/image-client/client.hpp
        sed -i.bak 's/tcp::resolver::iterator/boost::asio::ip::tcp::resolver::results_type/g' src/image-client/main.cpp
        
        # 2. Fix the Lambda parameter inside async_connect.
        # Match "ec, <results_type>" and change it to "ec, <endpoint>"
        # Also matching the short form "tcp::resolver::results_type"
        sed -i.bak 's/ec, boost::asio::ip::tcp::resolver::results_type/ec, boost::asio::ip::tcp::endpoint/g' src/image-client/client.hpp
        sed -i.bak 's/ec, tcp::resolver::results_type/ec, boost::asio::ip::tcp::endpoint/g' src/image-client/client.hpp
        
        # 3. Fix resolve call
        # resolver.resolve({ argv[1], argv[2] }) -> resolver.resolve(argv[1], argv[2])
        sed -i.bak 's/resolver.resolve({ argv\[1\], argv\[2\] })/resolver.resolve(argv[1], argv[2])/g' src/image-client/main.cpp

        # 4. Fix m_ios.post (using .get_executor() for compatibility)
        sed -i.bak 's/m_ios.post(/boost::asio::post(m_ios.get_executor(), /g' src/image-client/client.hpp

        # Cleanup backup files created by sed -i.bak
        find . -name "*.bak" -type f -delete

    - name: Patch dlib System Header (Linux only)
      if: runner.os == 'Linux'
      # Fix dlib GUI error on Linux (DLIB_NO_GUI_SUPPORT defined by default in package)
      run: |
        sudo sed -i '1i #undef DLIB_NO_GUI_SUPPORT' /usr/include/dlib/gui_core/gui_core_kernel_2.h

    - name: Patch dlib System Header (macOS only)
      if: runner.os == 'macOS'
      # Fix dlib GUI error on macOS (DLIB_NO_GUI_SUPPORT defined by default in Homebrew bottle)
      # We find the dlib prefix using brew --prefix, then patch the header.
      run: |
        DLIB_PREFIX=$(brew --prefix dlib)
        DLIB_HEADER="${DLIB_PREFIX}/include/dlib/gui_core/gui_core_kernel_2.h"
        echo "Patching macOS Dlib header at: ${DLIB_HEADER}"
        # Prepend the undef line using a temporary file to avoid BSD sed syntax issues with 'i' command
        echo "#undef DLIB_NO_GUI_SUPPORT" | cat - "${DLIB_HEADER}" > "${DLIB_HEADER}.tmp"
        mv "${DLIB_HEADER}.tmp" "${DLIB_HEADER}"

    - name: Configure CMake
      # -B sets the build directory
      # -DCMAKE_BUILD_TYPE is needed for single-configuration generators (like Unix Makefiles)
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      # --build starts the compilation
      # --config is needed for multi-configuration generators (like Visual Studio on Windows)
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # -C specifies the configuration to test (Release/Debug)
      # --output-on-failure makes it easier to debug CI failures
      run: ctest -C ${{env.BUILD_TYPE}} --output-on-failure

  windows-build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    # [Added] Install dependencies via vcpkg
    # fmt is the one causing the error, but adding others likely needed based on your includes.
    - name: Install dependencies with vcpkg
      run: |
        vcpkg install fmt:x64-windows msgpack-c:x64-windows asio:x64-windows nlohmann-json:x64-windows lz4:x64-windows
        vcpkg install opencv:x64-windows
        vcpkg install boost:x64-windows
      shell: cmd

    - name: Configure CMake
      # [Modified] Added CMAKE_TOOLCHAIN_FILE to use vcpkg
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}